# Bridge Gateway - Render.com deployment manifest.
#
# Render auto-detects a Dockerfile, so this manifest is optional. It is kept in
# sync with Dockerfile and Makefile: the binary is compiled inside the Docker
# build, and the service listens on BRIDGE_PORT (4000).
services:
  - type: web
    name: bridge-gateway
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    buildContext: .
    autoDeploy: false
    envVars:
      - key: BRIDGE_PORT
        value: "4000"
      - key: BIFROST_MASTER_KEY
        sync: false
        description: Master key for the gateway API; stays inside the process.
      - key: ONNX_AUTO_DOWNLOAD
        value: "1"
        description: >-
          The image builds from source and does not bundle models/
          (gitignored): "1" downloads the ONNX artifacts on first start,
          while "0" disables the local ONNX engines for an offline image.
      - key: OLLAMA_HOST
        value: http://10.0.0.1:11434
        description: >-
          Endpoint of the Ollama service reachable from the container. Use
          http://host.docker.internal:11434 when Ollama runs on the same host.
