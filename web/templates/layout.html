{{define "head"}}<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bridge Gateway — {{.Title}}</title>
<script src="/static/htmx.min.js"></script>
<style>
:root{
  --bg:#0f1216; --panel:#171c22; --panel2:#1e242c; --line:#2a323d;
  --text:#e6edf3; --muted:#94a3b8; --accent:#4f8cff; --ok:#22c55e; --danger:#ef4444;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
a{color:var(--accent);text-decoration:none}
.sidebar{width:230px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.brand{font-size:1.15rem;font-weight:700;color:var(--accent);padding:6px 10px;margin-bottom:18px}
.brand span{color:var(--text);font-weight:600}
.sidebar a{padding:10px 12px;border-radius:8px;color:var(--muted);font-weight:500}
.sidebar a:hover{color:var(--text);background:var(--panel2)}
.sidebar a.active{color:var(--accent);background:var(--panel2)}
main{flex:1;padding:26px 34px;max-width:1100px;margin:0 auto;width:100%}
h1{font-size:1.5rem;margin:0 0 18px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.page-head h1{margin:0}
dialog{width:min(680px,92vw);max-height:88vh;overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog .card{border:none;margin:0;padding:0}
details.gen-params{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:12px}
details.gen-params summary{cursor:pointer;color:var(--muted);font-size:.85rem;font-weight:600}
details.gen-params .grid2{margin-top:8px}
p{margin:6px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.muted{color:var(--muted)}
.center{text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{font-size:.82rem;color:var(--muted);display:block;margin-bottom:10px}
input,select,textarea{
  width:100%;margin-top:4px;padding:9px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);color:var(--text);font:inherit;font-size:.9rem;
}
textarea{resize:vertical}
.btn{display:inline-block;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#fff;
  padding:9px 16px;border-radius:8px;font:inherit;font-size:.88rem;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
.btn.small{padding:5px 10px;font-size:.78rem;border-radius:6px}
.btn.danger{border-color:var(--danger);background:var(--danger)}
.actions{display:flex;gap:6px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
tr.active{background:rgba(34,197,94,.06)}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--panel2);color:var(--muted);font-size:.74rem;font-weight:600}
.badge.ok{background:rgba(34,197,94,.15);color:var(--ok)}
.table-wrap{overflow-x:auto}
.toast{padding:12px 14px;border-radius:10px;margin-bottom:14px;font-size:.9rem}
.toast.error{background:rgba(239,68,68,.12);border:1px solid var(--danger);color:var(--danger)}

/* ---- Chat Modern UI ---- */
.page-chat-container{display:flex;flex-direction:column;height:calc(100vh - 52px);max-width:960px;margin:0 auto;width:100%}
.chat-topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;flex-shrink:0}
.chat-topbar-left{display:flex;align-items:center;gap:10px;flex:1}
.chat-topbar-left label{font-size:.78rem;font-weight:600;color:var(--muted);margin:0;white-space:nowrap}
.chat-topbar select{margin:0;max-width:420px;padding:7px 12px;font-size:.85rem}
.chat-box{display:flex;flex-direction:column;flex:1;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.chat-messages-container{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:18px;scroll-behavior:smooth}
.chat-message{display:flex;gap:12px;align-items:flex-start;max-width:85%}
.chat-message.user{align-self:flex-end;flex-direction:row-reverse}
.chat-message.assistant{align-self:flex-start}
.chat-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.8rem;font-weight:700}
.chat-message.user .chat-avatar{background:var(--accent);color:#fff}
.chat-message.assistant .chat-avatar{background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff}
.chat-content-wrap{display:flex;flex-direction:column;gap:4px;min-width:0}
.chat-sender{font-size:.72rem;color:var(--muted);font-weight:600;padding:0 4px}
.chat-message.user .chat-sender{text-align:right}
.chat-message .bubble{padding:12px 16px;border-radius:16px;line-height:1.55;font-size:.92rem;white-space:pre-wrap;word-break:break-word}
.chat-message.user .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.chat-message.assistant .bubble{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-bottom-left-radius:4px}
.chat-message .bubble pre{background:rgba(0,0,0,.35);padding:10px 12px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.82rem;margin:8px 0}
.chat-message .bubble code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:rgba(0,0,0,.25);padding:2px 5px;border-radius:4px;font-size:.85em}

.chat-empty-state{margin:auto;text-align:center;max-width:440px;padding:40px 20px;color:var(--muted)}
.chat-empty-icon{font-size:2.4rem;margin-bottom:12px;display:inline-block;opacity:.8}
.chat-empty-title{font-size:1.15rem;font-weight:600;color:var(--text);margin-bottom:6px}
.chat-empty-desc{font-size:.85rem;line-height:1.5}

/* Exemple curl dans l'etat vide de la discussion */
.curl-example{margin-top:22px;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.curl-example summary{cursor:pointer;padding:10px 14px;color:var(--muted);font-size:.82rem;font-weight:600}
.curl-example-desc{font-size:.76rem;line-height:1.5;padding:0 14px;margin:4px 0 10px}
.curl-example-desc code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:rgba(0,0,0,.25);padding:1px 4px;border-radius:4px;font-size:.95em}
.curl-example-model{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text);background:rgba(0,0,0,.25);padding:1px 4px;border-radius:4px}
.curl-example-row{display:flex;gap:10px;align-items:flex-start;padding:0 14px}
.curl-example-row .btn{flex-shrink:0;margin-top:2px}
.curl-example-code{flex:1;margin:0;padding:12px 14px;border-radius:8px;background:rgba(0,0,0,.35);border:1px solid var(--line);overflow-x:auto;text-align:left}
.curl-example-code code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.74rem;line-height:1.6;color:var(--text);white-space:pre}
.curl-example-hint{font-size:.72rem;line-height:1.5;padding:0 14px 12px;margin:8px 0 0}
.curl-example-hint code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.95em}

.chat-input-area{padding:14px 18px 12px;background:var(--panel);border-top:1px solid var(--line);flex-shrink:0}
.chat-input-form{display:flex;flex-direction:column;gap:8px}
.chat-input-row{display:flex;gap:10px;align-items:flex-end;position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 14px;transition:border-color .15s}
.chat-input-row:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px rgba(79,140,255,.15)}
.chat-textarea{flex:1;background:transparent;border:none;color:var(--text);font:inherit;font-size:.92rem;line-height:1.45;resize:none;outline:none;padding:6px 0;margin:0;min-height:24px;max-height:160px;height:24px}
.chat-send-btn{border-radius:10px;padding:8px 14px;height:38px;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex-shrink:0}
.chat-send-btn svg{width:16px;height:16px;fill:currentColor}
.chat-input-hint{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;color:var(--muted);padding:0 4px}

/* Typing indicator */
.typing-indicator{display:none;gap:4px;padding:12px 16px;background:var(--panel2);border:1px solid var(--line);border-radius:16px;border-bottom-left-radius:4px;width:fit-content;align-items:center}
.typing-indicator.htmx-request{display:flex}
.typing-dot{width:6px;height:6px;background:var(--muted);border-radius:50%;animation:typingBounce 1.4s infinite ease-in-out both}
.typing-dot:nth-child(1){animation-delay:-0.32s}
.typing-dot:nth-child(2){animation-delay:-0.16s}
@keyframes typingBounce{0%,80%,100%{transform:scale(0);opacity:.4}40%{transform:scale(1);opacity:1}}
</style>
</head>
{{end}}

{{define "nav"}}
<aside class="sidebar">
  <div class="brand">Bridge<span>Gateway</span></div>
  <a href="/" {{if eq .Active "chat"}}class="active"{{end}}>Discussion</a>
  <a href="/providers" {{if eq .Active "providers"}}class="active"{{end}}>Providers</a>
  <a href="/models" {{if eq .Active "models"}}class="active"{{end}}>Modeles</a>
  <a href="/projects" {{if eq .Active "configs"}}class="active"{{end}}>Projets</a>
</aside>
{{end}}

{{define "tail"}}
</main>
</body>
</html>
{{end}}

{{define "toast_error"}}<div class="toast error"><strong>Erreur :</strong> {{.}}</div>{{end}}
