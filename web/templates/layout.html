{{define "head"}}<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bridge Gateway — {{.Title}}</title>
<script src="/static/htmx.min.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:#0f1216; --panel:#171c22; --panel2:#1e242c; --line:#2a323d; --line-strong:#3a4452;
  --text:#e6edf3; --muted:#94a3b8;
  --accent:#4f8cff; --accent-hover:#7fb0ff; --accent-strong:#2f6ae0; --accent-strong-hover:#2559c4;
  --ok:#22c55e; --warn:#f0b429; --danger:#ef4444;
  --radius-sm:5px; --radius:8px; --radius-lg:12px;
  --shadow-lg:0 16px 40px rgba(0,0,0,.5);
  --ring:0 0 0 3px rgba(79,140,255,.28);
  --ease:140ms ease;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans);font-size:15px;line-height:1.55;background:var(--bg);color:var(--text);display:flex;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none;text-underline-offset:3px}
a:hover{color:var(--accent-hover)}
main a:not(.btn):hover{text-decoration:underline}
::selection{background:rgba(79,140,255,.3);color:var(--text)}
h1,h2,h3,h4{line-height:1.2;letter-spacing:-.015em}
code,kbd{font-family:var(--font-mono);font-size:.9em}
td code,li code,p code{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:.84em}
hr{border:none;border-top:1px solid var(--line);margin:24px 0}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#4a5666}
.sidebar{width:232px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-size:1.05rem;font-weight:700;letter-spacing:-.02em;color:var(--text);padding:6px 10px;margin-bottom:14px}
.brand span{color:var(--muted);font-weight:500}
.sidebar a{display:block;padding:8px 10px;border-radius:var(--radius);border-left:2px solid transparent;color:var(--muted);font-size:.9rem;font-weight:500;transition:color var(--ease),background-color var(--ease),border-color var(--ease)}
.sidebar a:hover{color:var(--text);background:var(--panel2);text-decoration:none}
.sidebar a.active{color:var(--text);background:var(--panel2);border-left-color:var(--accent)}
main{flex:1;padding:28px 32px 56px;max-width:1100px;margin:0 auto;width:100%;min-width:0}
h1{font-size:1.45rem;font-weight:650;margin:0 0 6px;letter-spacing:-.02em}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
.page-head h1{margin:0 0 4px}
.page-head p{max-width:74ch;font-size:.86rem;margin:0}
dialog{width:min(700px,94vw);max-height:88vh;overflow:auto;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--panel);color:var(--text);padding:22px;box-shadow:var(--shadow-lg);overscroll-behavior:contain}
dialog::backdrop{background:rgba(6,9,13,.72)}
dialog .card{border:none;margin:0;padding:0}
details.gen-params{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:12px}
details.gen-params summary{cursor:pointer;color:var(--muted);font-size:.85rem;font-weight:600}
details.gen-params .grid2{margin-top:8px}
p{margin:6px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px;margin-bottom:16px}
.muted{color:var(--muted)}
.center{text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{font-size:.8rem;color:var(--muted);display:block;margin-bottom:10px;line-height:1.45}
input,select,textarea{
  width:100%;margin-top:5px;padding:8px 10px;border-radius:var(--radius);border:1px solid var(--line);
  background:var(--panel2);color:var(--text);font:inherit;font-size:.88rem;
  transition:border-color var(--ease),box-shadow var(--ease);
}
input:hover,select:hover,textarea:hover{border-color:var(--line-strong)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
::placeholder{color:#8693a4}
textarea{resize:vertical;line-height:1.55}
input[type="checkbox"],input[type="radio"]{width:auto;margin:0;padding:0;accent-color:var(--accent);cursor:pointer;box-shadow:none}
input[type="file"]{padding:7px 8px;font-size:.82rem;color:var(--muted)}
input[type="file"]::file-selector-button{margin-right:10px;padding:5px 10px;border-radius:var(--radius-sm);border:1px solid var(--line-strong);background:var(--panel);color:var(--text);font:inherit;font-size:.8rem;cursor:pointer;transition:border-color var(--ease),color var(--ease)}
input[type="file"]::file-selector-button:hover{border-color:var(--accent);color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
  border:1px solid var(--accent-strong);background:var(--accent-strong);color:#fff;
  padding:8px 14px;border-radius:var(--radius);font:inherit;font-size:.85rem;font-weight:600;
  line-height:1.25;white-space:nowrap;text-decoration:none;
  transition:background-color var(--ease),border-color var(--ease),color var(--ease),transform 80ms ease}
.btn:hover{background:var(--accent-strong-hover);border-color:var(--accent-strong-hover);color:#fff;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn:disabled,.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.ghost:hover{background:var(--panel2);border-color:var(--line-strong);color:var(--text)}
.btn.small{padding:4px 9px;font-size:.78rem}
.btn.danger{border-color:#b91c1c;background:#b91c1c}
.btn.danger:hover{background:var(--danger);border-color:var(--danger)}
.actions{display:flex;gap:6px}
table{width:100%;border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
tbody tr{transition:background-color var(--ease)}
tbody tr:hover{background:rgba(255,255,255,.02)}
tr.active{background:rgba(34,197,94,.06)}
tbody tr:last-child td{border-bottom:none}
.badge{display:inline-flex;align-items:center;gap:5px;padding:1px 7px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);font-size:.72rem;font-weight:600;line-height:1.7;white-space:nowrap}
.badge.ok{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.35);color:var(--ok)}
.table-wrap{overflow-x:auto}
.schema-table-wrap{overflow-x:visible;max-width:100%;margin-bottom:6px}
.schema-rows th,.schema-rows td{padding:6px 8px;vertical-align:middle}
.schema-rows input,.schema-rows select{margin-top:0;padding:6px 8px;font-size:.85rem}
.schema-constraints-dropdown{position:relative;display:inline-block}
.schema-constraints-dropdown summary{cursor:pointer;font-size:.85rem;color:var(--muted);padding:4px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);list-style:none;display:inline-flex;align-items:center;justify-content:center;user-select:none;transition:all .15s}
.schema-constraints-dropdown summary::-webkit-details-marker{display:none}
.schema-constraints-dropdown summary:hover{color:var(--text);border-color:var(--accent)}
.schema-constraints-dropdown[open] summary{color:var(--accent);border-color:var(--accent);background:var(--panel)}
.schema-constraints-panel{position:absolute;z-index:50;top:calc(100% + 6px);right:0;width:300px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:0 10px 28px rgba(0,0,0,.6);display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left}
.schema-constraints-panel label{font-size:.74rem;color:var(--muted);margin:0;display:flex;flex-direction:column}
.schema-constraints-panel input, .schema-constraints-panel select{padding:6px 8px;font-size:.8rem;margin-top:4px}
.schema-constraints-panel label:nth-child(1){grid-column:1 / -1}
.schema-constraints-panel label:nth-child(4){grid-column:1 / -1}
.schema-constraints-panel label:nth-child(5){grid-column:1 / -1}
.toast{padding:10px 14px;border-radius:var(--radius);border:1px solid var(--line);border-left:3px solid var(--muted);background:var(--panel2);margin-bottom:14px;font-size:.86rem;line-height:1.5}
.toast.error{border-left-color:var(--danger);background:rgba(239,68,68,.1);color:var(--danger)}
.toast.ok{border-left-color:var(--ok);background:rgba(34,197,94,.1);color:var(--ok)}
.card-title{font-size:.95rem;font-weight:600;margin:0 0 12px}
.note{font-size:.78rem;line-height:1.5;color:var(--muted);margin:0 0 12px;max-width:74ch}
.form-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hint{color:var(--muted);font-size:.76rem;line-height:1.45}
.empty-state{padding:34px 20px;max-width:52ch;margin-left:auto;margin-right:auto;line-height:1.6}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.meta-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.source-chunk{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px}
.meter{height:8px;background:rgba(0,0,0,.4);border-radius:4px;overflow:hidden;margin-bottom:8px}
.meter-fill{height:100%;background:var(--muted);border-radius:4px;transition:width .4s ease}
.meter-fill.meter-accent{background:var(--accent)}
.meter-fill.meter-ok{background:var(--ok)}

/* ---- Chat Modern UI ---- */
.page-chat-container{display:flex;flex-direction:column;height:calc(100vh - 36px);max-width:960px;margin:0 auto;width:100%;padding:20px 32px 16px}
.chat-topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;flex-shrink:0}
.chat-topbar-left{display:flex;align-items:center;gap:10px;flex:1}
.chat-topbar-left label{font-size:.78rem;font-weight:600;color:var(--muted);margin:0;white-space:nowrap}
.chat-topbar select{margin:0;max-width:420px;padding:7px 12px;font-size:.85rem}
.chat-box{display:flex;flex-direction:column;flex:1;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.chat-messages-container{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:18px;scroll-behavior:smooth}
.chat-message{display:flex;gap:12px;align-items:flex-start;max-width:85%}
.chat-message.user{align-self:flex-end;flex-direction:row-reverse}
.chat-message.assistant{align-self:flex-start}
.chat-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.8rem;font-weight:700}
.chat-message.user .chat-avatar{background:var(--accent-strong);color:#fff}
.chat-message.assistant .chat-avatar{background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.chat-content-wrap{display:flex;flex-direction:column;gap:4px;min-width:0}
.chat-sender{font-size:.72rem;color:var(--muted);font-weight:600;padding:0 4px}
.chat-message.user .chat-sender{text-align:right}
.chat-message .bubble{padding:11px 15px;border-radius:var(--radius-lg);line-height:1.6;font-size:.9rem;white-space:pre-wrap;word-break:break-word}
.chat-message.user .bubble{background:var(--accent-strong);color:#fff;border-bottom-right-radius:4px}
.chat-message.assistant .bubble{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-bottom-left-radius:4px}
.chat-message .bubble pre{background:rgba(0,0,0,.35);padding:10px 12px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.82rem;margin:8px 0}
.chat-message .bubble code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:rgba(0,0,0,.25);padding:2px 5px;border-radius:4px;font-size:.85em}

.chat-empty-state{margin:auto;text-align:center;max-width:440px;padding:40px 20px;color:var(--muted)}
.chat-empty-icon{font-size:2.4rem;margin-bottom:12px;display:inline-block;opacity:.8}
.chat-empty-title{font-size:1.15rem;font-weight:600;color:var(--text);margin-bottom:6px}
.chat-empty-desc{font-size:.85rem;line-height:1.5}

/* Exemple curl dans l'etat vide de la discussion */
.curl-example{margin-top:22px;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.curl-example summary{cursor:pointer;padding:10px 14px;color:var(--muted);font-size:.82rem;font-weight:600}
.curl-example-desc{font-size:.76rem;line-height:1.5;padding:0 14px;margin:4px 0 10px}
.curl-example-desc code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:rgba(0,0,0,.25);padding:1px 4px;border-radius:4px;font-size:.95em}
.curl-example-model{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text);background:rgba(0,0,0,.25);padding:1px 4px;border-radius:4px}
.curl-example-row{display:flex;gap:10px;align-items:flex-start;padding:0 14px}
.curl-example-row .btn{flex-shrink:0;margin-top:2px}
.curl-example-code{flex:1;margin:0;padding:12px 14px;border-radius:8px;background:rgba(0,0,0,.35);border:1px solid var(--line);overflow-x:auto;text-align:left}
.curl-example-code code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.74rem;line-height:1.6;color:var(--text);white-space:pre}
.curl-example-hint{font-size:.72rem;line-height:1.5;padding:0 14px 12px;margin:8px 0 0}
.curl-example-hint code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.95em}

.chat-input-area{padding:14px 18px 12px;background:var(--panel);border-top:1px solid var(--line);flex-shrink:0}
.chat-input-form{display:flex;flex-direction:column;gap:8px}
.chat-input-row{display:flex;gap:10px;align-items:flex-end;position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 14px;transition:border-color .15s}
.chat-input-row:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px rgba(79,140,255,.15)}
.chat-textarea{flex:1;background:transparent;border:none;color:var(--text);font:inherit;font-size:.92rem;line-height:1.45;resize:none;outline:none;padding:6px 0;margin:0;min-height:24px;max-height:160px;height:24px}
.chat-send-btn{border-radius:10px;padding:8px 14px;height:38px;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex-shrink:0}
.chat-send-btn svg{width:16px;height:16px;fill:currentColor}
.chat-input-hint{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;color:var(--muted);padding:0 4px}

/* Typing indicator */
.typing-indicator{display:none;gap:4px;padding:12px 16px;background:var(--panel2);border:1px solid var(--line);border-radius:16px;border-bottom-left-radius:4px;width:fit-content;align-items:center}
.typing-indicator.htmx-request{display:flex}
.typing-dot{width:6px;height:6px;background:var(--muted);border-radius:50%;animation:typingBounce 1.4s infinite ease-in-out both}
.typing-dot:nth-child(1){animation-delay:-0.32s}
.typing-dot:nth-child(2){animation-delay:-0.16s}
@keyframes typingBounce{0%,80%,100%{transform:scale(0);opacity:.4}40%{transform:scale(1);opacity:1}}

/* ---- Monitoring ---- */
.mon-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat-label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;margin-bottom:6px}
.stat-value{display:block;font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.stat-value.stat-err{color:var(--danger)}
.stat-hint{display:block;font-size:.72rem;color:var(--muted);margin-top:5px}
.mon-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.mon-card h3{font-size:.75rem;margin:0 0 12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.mon-card table th,.mon-card table td{padding:8px 10px}
.mon-columns{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;align-items:start}
@media (max-width:900px){.mon-columns{grid-template-columns:1fr}}
.bars{display:flex;align-items:flex-end;gap:2px;height:110px;padding-top:4px}
.bar-col{flex:1;height:100%;display:flex;align-items:flex-end;min-width:2px}
.bar{width:100%;background:var(--accent);opacity:.85;border-radius:2px 2px 0 0;min-height:2px;transition:height .2s,opacity var(--ease)}
.bar:hover{opacity:1}
.bar-error{background:var(--danger);opacity:.9}
.bars-axis{display:flex;justify-content:space-between;font-size:.68rem;color:var(--muted);margin-top:6px}
.mon-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.badge.warn{background:rgba(240,180,41,.12);border-color:rgba(240,180,41,.35);color:var(--warn)}
.badge.err{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.35);color:var(--danger)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.85rem}
.kv:last-child{border-bottom:none}
.kv span{color:var(--muted)}

/* ---- Monitoring: modale de logs ---- */
.logs-dialog{width:min(1000px,96vw)}
.log-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px}
.log-head h2{font-size:1.05rem;margin:0 0 4px}
.log-head p{margin:0;font-size:.78rem;line-height:1.45}
.log-filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.log-filters label{margin:0;font-size:.72rem;flex:1;min-width:140px}
.log-filters select,.log-filters input{margin-top:4px;padding:7px 9px;font-size:.82rem}
.log-entry{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--panel2)}
.log-entry.log-entry-error{border-color:rgba(239,68,68,.55)}
.log-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:.8rem;margin-bottom:10px}
.log-io{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:820px){.log-io{grid-template-columns:1fr}}
.log-label{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;margin-bottom:4px}
.log-io pre{margin:0;padding:10px 12px;border-radius:8px;background:rgba(0,0,0,.35);border:1px solid var(--line);
  max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-word;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.76rem;line-height:1.5}
.log-error{margin:10px 0 0;color:var(--danger);font-size:.8rem}

/* ---- Focus, motion & mobile ---- */
:where(a,button,summary,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--radius-sm)}
.chat-textarea:focus-visible{outline:none;box-shadow:none}
.chat-served-model{font-size:.74rem;color:var(--muted);padding:6px 4px 0}
.chat-served-model .hint{font-size:.72rem}
@media (max-width:860px){
  body{flex-direction:column}
  .sidebar{width:100%;height:auto;position:sticky;top:0;z-index:20;flex-direction:row;align-items:center;overflow-x:auto;gap:2px;padding:8px 10px;border-right:none;border-bottom:1px solid var(--line)}
  .brand{margin:0 10px 0 2px;white-space:nowrap;font-size:.95rem}
  .sidebar a{padding:6px 10px;font-size:.82rem;white-space:nowrap;border-left:none;border-bottom:2px solid transparent;border-radius:var(--radius) var(--radius) 0 0}
  .sidebar a.active{background:transparent;border-bottom-color:var(--accent)}
  main{padding:20px 16px 40px}
  .page-chat-container{height:calc(100vh - 92px);padding:14px 16px 12px}
  .grid2{grid-template-columns:1fr}
  .chat-message{max-width:92%}
  .log-head{flex-direction:column}
  .schema-constraints-panel{width:min(300px,86vw)}
}
@media (max-width:640px){
  h1{font-size:1.25rem}
  .page-head{flex-wrap:wrap}
  .actions{flex-wrap:wrap}
  .stat-value{font-size:1.3rem}
  dialog{padding:16px;width:96vw}
  .chat-topbar{flex-wrap:wrap}
  .chat-topbar select{max-width:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>
{{end}}

{{define "nav"}}

  <div class="brand">Bridge<span>Gateway</span></div>

<script>
// Constructeur de schema : ajout/suppression de champs et synchronisation bi-directionnelle avec le JSON.
(function () {
  if (window.__schemaBuilderInitialized) return;
  window.__schemaBuilderInitialized = true;

  var isSyncing = false;

  function rowsOf(table) {
    if (!table) return [];
    var tbody = table.querySelector('tbody') || (table.tBodies && table.tBodies[0]);
    return tbody ? Array.prototype.slice.call(tbody.rows) : [];
  }

  function renumber(table) {
    rowsOf(table).forEach(function (row, index) {
      var box = row.querySelector('[data-role="required"]');
      if (box) { box.value = String(index); }
    });
  }

  function updateJSONFromRows(builderEl) {
    if (isSyncing || !builderEl) return;
    isSyncing = true;
    try {
      var textarea = builderEl.querySelector('textarea[name="response_schema"]');
      if (!textarea) return;

      var table = builderEl.querySelector('.schema-rows');
      var rows = rowsOf(table);
      var properties = {};
      var required = [];

      rows.forEach(function (row) {
        var nameInput = row.querySelector('input[name="schema_field_name[]"]');
        var typeSelect = row.querySelector('select[name="schema_field_type[]"]');
        var descInput = row.querySelector('input[name="schema_field_description[]"]');
        var enumInput = row.querySelector('input[name="schema_field_enum[]"]');
        var minInput = row.querySelector('input[name="schema_field_min[]"]');
        var maxInput = row.querySelector('input[name="schema_field_max[]"]');
        var patternInput = row.querySelector('input[name="schema_field_pattern[]"]');
        var itemsSelect = row.querySelector('select[name="schema_field_items[]"]');
        var reqBox = row.querySelector('[data-role="required"]');

        var name = nameInput ? nameInput.value.trim() : '';
        if (!name) return;

        var type = typeSelect ? typeSelect.value : 'string';
        var prop = { type: type };

        var desc = descInput ? descInput.value.trim() : '';
        if (desc) prop.description = desc;

        var enumVal = enumInput ? enumInput.value.trim() : '';
        if (enumVal) {
          prop.enum = enumVal.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
        }

        var minVal = minInput ? minInput.value.trim() : '';
        var maxVal = maxInput ? maxInput.value.trim() : '';
        var patternVal = patternInput ? patternInput.value.trim() : '';
        var itemsVal = itemsSelect ? itemsSelect.value.trim() : '';

        if (type === 'string') {
          if (minVal !== '' && !isNaN(parseInt(minVal, 10))) prop.minLength = parseInt(minVal, 10);
          if (maxVal !== '' && !isNaN(parseInt(maxVal, 10))) prop.maxLength = parseInt(maxVal, 10);
          if (patternVal) prop.pattern = patternVal;
        } else if (type === 'number' || type === 'integer') {
          if (minVal !== '' && !isNaN(parseFloat(minVal))) prop.minimum = parseFloat(minVal);
          if (maxVal !== '' && !isNaN(parseFloat(maxVal))) prop.maximum = parseFloat(maxVal);
        } else if (type === 'array') {
          prop.items = { type: itemsVal || 'string' };
        }

        properties[name] = prop;
        if (reqBox && reqBox.checked) {
          required.push(name);
        }
      });

      if (Object.keys(properties).length === 0) {
        textarea.value = '';
      } else {
        var schema = {
          type: 'object',
          properties: properties,
          additionalProperties: false
        };
        if (required.length > 0) {
          required.sort();
          schema.required = required;
        }
        textarea.value = JSON.stringify(schema, null, 2);
      }
    } finally {
      isSyncing = false;
    }
  }

  function updateRowsFromJSON(builderEl) {
    if (isSyncing || !builderEl) return;
    var textarea = builderEl.querySelector('textarea[name="response_schema"]');
    if (!textarea) return;

    var val = textarea.value.trim();
    if (!val) return;

    var parsed;
    try {
      parsed = JSON.parse(val);
    } catch (e) {
      return;
    }

    if (!parsed || typeof parsed !== 'object' || parsed.type !== 'object' || !parsed.properties) {
      return;
    }

    var table = builderEl.querySelector('.schema-rows');
    var tbody = table ? (table.querySelector('tbody') || table.tBodies[0]) : null;
    var template = document.getElementById('schema-row-template');
    if (!tbody || !template) return;

    var requiredSet = {};
    if (Array.isArray(parsed.required)) {
      parsed.required.forEach(function (k) { requiredSet[k] = true; });
    }

    var propNames = Object.keys(parsed.properties);
    if (propNames.length === 0) return;

    isSyncing = true;
    try {
      tbody.innerHTML = '';
      propNames.forEach(function (name, idx) {
        var prop = parsed.properties[name] || {};
        var clone = template.content.cloneNode(true);

        var nameInput = clone.querySelector('input[name="schema_field_name[]"]');
        if (nameInput) nameInput.value = name;

        var typeSelect = clone.querySelector('select[name="schema_field_type[]"]');
        if (typeSelect && prop.type) typeSelect.value = prop.type;

        var descInput = clone.querySelector('input[name="schema_field_description[]"]');
        if (descInput && prop.description) descInput.value = prop.description;

        var reqBox = clone.querySelector('[data-role="required"]');
        if (reqBox) {
          reqBox.checked = !!requiredSet[name];
          reqBox.value = String(idx);
        }

        var enumInput = clone.querySelector('input[name="schema_field_enum[]"]');
        if (enumInput && Array.isArray(prop.enum)) enumInput.value = prop.enum.join(', ');

        var minInput = clone.querySelector('input[name="schema_field_min[]"]');
        if (minInput) {
          if (prop.minLength !== undefined) minInput.value = prop.minLength;
          else if (prop.minimum !== undefined) minInput.value = prop.minimum;
        }

        var maxInput = clone.querySelector('input[name="schema_field_max[]"]');
        if (maxInput) {
          if (prop.maxLength !== undefined) maxInput.value = prop.maxLength;
          else if (prop.maximum !== undefined) maxInput.value = prop.maximum;
        }

        var patternInput = clone.querySelector('input[name="schema_field_pattern[]"]');
        if (patternInput && prop.pattern) patternInput.value = prop.pattern;

        var itemsSelect = clone.querySelector('select[name="schema_field_items[]"]');
        if (itemsSelect && prop.items && prop.items.type) itemsSelect.value = prop.items.type;

        tbody.appendChild(clone);
      });
      renumber(table);
    } finally {
      isSyncing = false;
    }
  }

  function addRow(table) {
    var template = document.getElementById('schema-row-template');
    if (!template) { return; }
    var tbody = table.querySelector('tbody') || (table.tBodies && table.tBodies[0]);
    if (!tbody) { return; }
    tbody.appendChild(template.content.cloneNode(true));
    renumber(table);
    var rows = rowsOf(table);
    var last = rows[rows.length - 1];
    var name = last && last.querySelector('input[name="schema_field_name[]"]');
    if (name) { name.focus(); }
    var builder = table.closest('.schema-builder');
    if (builder) updateJSONFromRows(builder);
  }

  function removeRow(row) {
    var table = row.closest('table');
    if (!table) { return; }
    var rows = rowsOf(table);
    if (rows.length <= 1) {
      rows[0].querySelectorAll('input, select').forEach(function (el) {
        if (el.type === 'checkbox') { el.checked = false; } else { el.value = ''; }
      });
      renumber(table);
      var builder = table.closest('.schema-builder');
      if (builder) updateJSONFromRows(builder);
      return;
    }
    row.remove();
    renumber(table);
    var builder = table.closest('.schema-builder');
    if (builder) updateJSONFromRows(builder);
  }

  document.addEventListener('input', function (event) {
    var target = event.target;
    if (!target) return;
    if (target.name === 'response_schema') {
      var builder = target.closest('.schema-builder');
      if (builder) updateRowsFromJSON(builder);
      return;
    }
    var builder = target.closest('.schema-builder');
    if (builder && target.name && target.name.startsWith('schema_field_')) {
      updateJSONFromRows(builder);
    }
  });

  document.addEventListener('change', function (event) {
    var target = event.target;
    if (!target) return;
    var builder = target.closest('.schema-builder');
    if (builder && target.name && target.name.startsWith('schema_field_')) {
      updateJSONFromRows(builder);
    }
  });

  document.addEventListener('click', function (event) {
    var target = event.target;
    if (!target) { return; }

    var openDropdowns = document.querySelectorAll('.schema-constraints-dropdown[open]');
    openDropdowns.forEach(function (dd) {
      if (!dd.contains(target)) {
        dd.removeAttribute('open');
      }
    });

    var addBtn = target.closest('#schema-add-field');
    if (addBtn) {
      event.preventDefault();
      var builder = addBtn.closest('.schema-builder');
      var table = builder ? builder.querySelector('table.schema-rows') : null;
      if (table) { addRow(table); }
      return;
    }

    var remove = target.closest('[data-role="remove-row"]');
    if (remove) {
      event.preventDefault();
      removeRow(remove.closest('tr'));
      return;
    }
  });

  document.addEventListener('change', function(e){
    if(e.target && e.target.id === 'cfg-provider'){
      var opt = e.target.selectedOptions ? e.target.selectedOptions[0] : e.target.options[e.target.selectedIndex];
      var baseURL = opt ? (opt.dataset.baseUrl || '') : '';
      var apiKey = opt ? (opt.dataset.apiKey || '') : '';
      var url = document.getElementById('cfg-base-url');
      if(url) url.value = baseURL;
      var key = document.getElementById('cfg-api-key');
      if(key) key.value = apiKey;
    }
  });
})();
</script>
</body>
</html>
