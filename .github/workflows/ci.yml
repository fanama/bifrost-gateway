name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Formatting
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt needed:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Readability caps
        run: go run ./tools/caps .

      - name: Tests (race)
        run: go test ./... -race -count=1

      - name: Build
        run: go build ./...
