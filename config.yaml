model_list:
  # Default LLM (local Ollama).
  - model_name: gemma4:e4b
    bifrost_params:
      provider: ollama
      model: gemma4:e4b

general_settings:
  master_key: "os.environ/BIFROST_MASTER_KEY"
  store_prompts_in_spend_logs: true

bifrost_settings:
  callbacks: ["enrichment"]
  enable_json_schema_validation: true

# Local in-memory cache (no Redis or external service).
cache:
  # Repository reads (configurations, projects, API keys). A short TTL keeps
  # UI edits visible almost immediately.
  stores:
    enabled: true
    ttl: "15s"
    max_entries: 2048
  # LLM responses: avoid calling a provider again for an identical request.
  llm_responses:
    enabled: true
    ttl: "5m"
    max_entries: 512

# Tier routing by conversation complexity.
#
# Each project configuration carries a tier (fast < balanced < frontier). A
# small local model classifies the conversation, and the request starts at the
# lowest tier that suffices. If the provider saturates (rate limit, quota,
# context overflow, outage, rejected key), the request moves up one tier and
# the failing tier is cooled down temporarily.
#
# The decorator sits OUTSIDE the response cache: the key is computed from the
# active configuration, so a cache hit avoids both the classifier call and the
# failover ladder.
routing:
  enabled: false
  # Below this threshold the verdict is rejected and the active configuration
  # is kept: a borderline case is not a reason to guess.
  min_confidence: 0.6
  # How long a failing tier is skipped. Zero disables saturation memory.
  cooldown: "60s"
  # Maximum number of models tried. Zero means the whole ladder (3 tiers).
  max_attempts: 0
  # Bifrost retries per call. Reduced to 1 when routing is active, because the
  # tier ladder already retries on another model.
  max_retries: 1
  classifier:
    # Local model: zero cost and available offline. Avoid a slow model here: it
    # is called on every uncached request. Measured on this setup, gemma4:e4b as
    # a classifier costs ~25 s per request, while a small model such as
    # granite4:tiny-h takes a fraction of a second.
    provider: ollama
    model: granite4:tiny-h
    # Empty BaseURL = provider default (OLLAMA_HOST or http://localhost:11434).
    base_url: ""
    # The whole history is classified, not only the last message. This cap
    # prevents a very long conversation from costing more to classify than the
    # answer it is trying to optimize.
    max_input_chars: 6000
    max_tokens: 64
    # Beyond this delay the classifier is abandoned and the active
    # configuration is used: sacrifice routing precision, never the request.
    timeout: "10s"
