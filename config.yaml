model_list:
  # Modele LLM par defaut (Ollama local)
  - model_name: gemma4:e4b
    bifrost_params:
      provider: ollama
      model: gemma4:e4b

general_settings:
  master_key: "os.environ/BIFROST_MASTER_KEY"
  database_url: "os.environ/DATABASE_URL"
  store_model_in_db: true
  store_prompts_in_spend_logs: true

bifrost_settings:
  callbacks: ["enrichment"]
  cache: true
  cache_params:
    type: "redis"
    namespace: "bifrost.caching.caching"
    host: "os.environ/REDIS_STANDALONE_HOST"
    port: "os.environ/REDIS_STANDALONE_PORT"
  enable_json_schema_validation: true

router_settings:
  redis_host: "os.environ/REDIS_STANDALONE_HOST"
  redis_port: "os.environ/REDIS_STANDALONE_PORT"
