services:
  # ==========================================
  # PASSERELLE BRIDGE (application)
  # ==========================================
  gateway:
    build: .
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./data:/app/data
    ports:
      - "${BRIDGE_PORT:-4000}:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - llmaas
    command: ["--config", "/app/config.yaml", "--port", "8080", "--store", "/app/data/configs.json"]
    restart: unless-stopped

  # ==========================================
  # DEPENDANCES EXTERNES (simulees)
  # ==========================================
  redis:
    image: redis:8.6.2-alpine
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - llmaas
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - llmaas
    restart: unless-stopped

# ==========================================
# VOLUMES ET RESEAUX
# ==========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  llmaas:
    name: llmaas
    driver: bridge