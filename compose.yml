services:
  # ==========================================
  # PASSERELLE BRIDGE (application)
  # ==========================================
  # Le gateway est autonome : persistance SQLite (fichier) et cache en memoire.
  # Aucun service externe n'est requis.
  gateway:
    build: .
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./data:/app/data
    ports:
      - "${BRIDGE_PORT:-4000}:8080"
    env_file:
      - .env
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - llmaas
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "8080"
      - "--db"
      - "/app/data/bridge.db"
      - "--import-json"
      - "/app/data"
    restart: unless-stopped

# ==========================================
# RESEAU
# ==========================================
networks:
  llmaas:
    name: llmaas
    driver: bridge