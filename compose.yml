services:
  # ==========================================
  # BRIDGE GATEWAY (application)
  # ==========================================
  # The gateway is self-contained: SQLite persistence (a file) and an
  # in-memory cache. No external service is required.
  gateway:
    build: .
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    ports:
      - "${BRIDGE_PORT:-4000}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - llmaas
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "8080"
      - "--db"
      - "/app/data/bridge.db"
      - "--import-json"
      - "/app/data"
    restart: unless-stopped

networks:
  llmaas:
    name: llmaas
    driver: bridge
